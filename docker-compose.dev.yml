version: '3.8'

services:
  dashboard:
    image: node:20-alpine
    container_name: homelab-dashboard
    working_dir: /app
    volumes:
      - .:/app
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - /var/run/fail2ban:/var/run/fail2ban:ro
    ports:
      - "3005:3000" # Wystawiamy port 3005 na Dellu
    command: sh -c "apk add --no-cache docker-cli fail2ban && npm install --legacy-peer-deps && npm run dev -- --hostname 0.0.0.0"
    environment:
      - NODE_ENV=development
      - DOCKER_API_VERSION=1.41
      - REDIS_URL=redis://mail-redis:6379
    restart: unless-stopped
    networks:
      - proxy-public # Musi być ta sieć!
      - mail-private

  mail-redis:
    image: redis:7-alpine
    container_name: mail-redis
    restart: unless-stopped
    networks:
      - mail-private

  mail-collector:
    build: ./mail-collector
    container_name: mail-collector
    restart: unless-stopped
    depends_on:
      - mail-redis
    environment:
      - REDIS_URL=redis://mail-redis:6379
      - MAIL_ACCOUNTS_FILE=/run/secrets/mail_accounts
      - REFRESH_INTERVAL_MS=60000
    networks:
      - mail-private
    secrets:
      - mail_accounts

networks:
  proxy-public:
    external: true
  mail-private:
    driver: bridge

secrets:
  mail_accounts:
    file: ./secrets/mail_accounts.json