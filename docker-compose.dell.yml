version: '3.8'

services:
  glances:
    image: nicolargo/glances:latest
    container_name: glances_dell
    restart: always
    ports:
      - "61208:61208"
    environment:
      - GLANCES_OPT=-w
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - /:/hostfs:ro
      - /mnt:/mnt:ro
    pid: host
    privileged: true
