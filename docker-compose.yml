version: "3.8"
services:
  dashboard:
    build:
      context: .
      dockerfile: Dockerfile.dev
    container_name: homelab-dashboard
    volumes:
      - .:/app
      - /app/node_modules
    networks:
      - cosmos-network
    ports:
      - "3001:3000"
    restart: always

networks:
  cosmos-network:
    external: true
