version: '3.8'

services:
  dashboard:
    build: .
    container_name: homelab-dashboard
    restart: unless-stopped
    pid: "host"
    privileged: true
    ports:
      - "3001:3000"
    environment:
      - NODE_ENV=production
      - REDIS_URL=redis://mail-redis:6379
    networks:
      - proxy-public
      - mail-private
    depends_on:
      - glances
      - mail-redis
    extra_hosts:
      - "host.docker.internal:host-gateway"
    user: "0:0"
    volumes:
      - /home/wojciech/security/check-security.sh:/usr/local/bin/check-security.sh:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - /etc/sudoers.d:/etc/sudoers.d:ro

  glances:
    image: nicolargo/glances:latest
    container_name: glances
    restart: unless-stopped
    pid: "host"
    privileged: true
    ports:
      - "61209:61208"
    environment:
      - "GLANCES_OPT=-w"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - /:/hostfs:ro
      - /mnt:/mnt:ro
    networks:
      - proxy-public

  mail-redis:
    image: redis:7-alpine
    container_name: mail-redis
    restart: unless-stopped
    networks:
      - mail-private

  mail-collector:
    build: ./mail-collector
    container_name: mail-collector
    restart: unless-stopped
    depends_on:
      - mail-redis
    environment:
      - REDIS_URL=redis://mail-redis:6379
      - MAIL_ACCOUNTS_FILE=/run/secrets/mail_accounts
      - REFRESH_INTERVAL_MS=60000
    networks:
      - mail-private
    secrets:
      - mail_accounts

networks:
  proxy-public:
    external: true
  mail-private:
    driver: bridge

secrets:
  mail_accounts:
    file: ./secrets/mail_accounts.json

